name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Electron 바이너리(약 100MB)는 CI에서 실행하지 않으므로 받지 않는다.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  core-and-web:
    name: 코어 테스트·타입 검사·웹/PC 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: core 타입 검사 (src 순수성 + test/scripts)
        run: npm run typecheck -w packages/core
      - name: core 테스트 (개인 녹화 합격 테스트는 파일이 없으면 건너뜀)
        run: npm test -w packages/core
      - name: 시험용 앱 웹 빌드
        run: npm run build -w apps/spike
      - name: PC 앱(Electron) main/preload 타입 검사·빌드
        run: npm run electron:build -w apps/spike

  android:
    name: Android APK 빌드
    runs-on: ubuntu-latest
    needs: core-and-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: 웹 빌드 + Capacitor 동기화
        run: npm run android:build -w apps/spike
      - name: 디버그 APK 빌드
        working-directory: apps/spike/android
        # Maven Central이 가끔 429(요청 과다)로 의존성 다운로드를 거절한다. 잠시 쉬었다가 최대 3번 시도한다.
        run: |
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Gradle 빌드 실패 (${i}/3). 30초 뒤 다시 시도해요."
            sleep 30
          done
          exit 1
      - name: 권한 확인 (CAMERA만, INTERNET 없음, allowBackup=false)
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=apps/spike/android/app/build/outputs/apk/debug/app-debug.apk
          "$AAPT2" dump permissions "$APK" | tee perms.txt
          if grep -q 'android.permission.INTERNET' perms.txt; then echo "INTERNET 권한이 들어 있어요"; exit 1; fi
          grep -q 'android.permission.CAMERA' perms.txt
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" | grep -A0 'allowBackup' | tee backup.txt
          grep -q '=false' backup.txt
