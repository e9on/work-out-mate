<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' blob: data:; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' blob: data:; media-src 'self' blob: mediastream:" />
  <title>Work Out Mate 스파이크</title>
</head>
<body>
  <div id="app">
    <div id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <div class="controls">
      <label>운동 <select id="exercise"></select></label>
      <label>모델 <select id="model"><option value="lite">lite</option><option value="full">full</option></select></label>
      <label>처리 장치 <select id="delegate"><option value="GPU">GPU</option><option value="CPU">CPU</option></select></label>
      <button id="start">카메라 시작</button>
      <button id="rec" class="rec" disabled>녹화 시작</button>
      <button id="tts">음성 테스트</button>
    </div>
    <div id="big"></div>
    <div id="hud"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
